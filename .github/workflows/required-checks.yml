        {
          "name": "Install frozen dependencies",
          "run": "pnpm install --frozen-lockfile"
        },
        {
          "name": "Run Required / Check",
          "run": "pnpm check"
        }
      ]
    },
    "unit": {
      "name": "Required / Unit",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 20,
      "steps": [
        {
          "name": "Check out the candidate",

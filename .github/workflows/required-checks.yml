          "run": "pnpm install --frozen-lockfile"
        },
        {
          "name": "Provision the hosted browser dependency",
          "run": "pnpm exec playwright install --with-deps chromium"
        },
        {
          "name": "Run Required / End-to-end",
          "run": "pnpm test:e2e"
        }
      ]

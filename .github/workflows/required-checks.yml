            "cache-dependency-path": "pnpm-lock.yaml"
          }
        },
        {
          "name": "Install frozen dependencies",
          "run": "pnpm install --frozen-lockfile"
        },
        {
          "name": "Run Required / Build",
          "run": "pnpm build"
        }
      ]
    },
    "check": {
      "name": "Required / Check",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 20,
      "steps": [
        {
          "name": "Check out the candidate",

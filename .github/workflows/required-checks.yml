        },
        {
          "name": "Run Required / Unit",
          "run": "pnpm test:unit"
        }
      ]
    },
    "integration": {
      "name": "Required / Integration",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 30,
      "steps": [
        {
